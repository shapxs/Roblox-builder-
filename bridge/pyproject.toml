[project]
name = "forge-roblox-bridge"
version = "0.1.0"
description = "Host-side bridge between Forge and Roblox Studio's built-in MCP server"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
roblox-bridge = "roblox_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
